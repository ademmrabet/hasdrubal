# Front Hasdrubal : application React + relais vers l'API.
# Tout passe par la meme origine : pas de CORS, et le cookie de session
# (limite a /api/auth) fonctionne sans configuration particuliere.

upstream hasdrubal_api {
  server server:4000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Photos de plats jusqu'a 5 Mo cote API : on laisse une marge.
  # Au-dela, reponse JSON lisible par l'interface plutot qu'une page HTML nginx.
  client_max_body_size 6m;
  error_page 413 @too_large;
  location @too_large {
    default_type application/json;
    return 413 '{"error":"Fichier trop lourd (5 Mo maximum)"}';
  }

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # API et photos : relayees vers le conteneur "server".
  location ~ ^/(api|uploads)/ {
    proxy_pass http://hasdrubal_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Fichiers compiles par Vite : nom avec empreinte, donc cache d'un an.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Service worker et manifeste : toujours revalides, sinon les appareils
  # ne verraient jamais qu'une nouvelle version existe.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Application monopage : toute route inconnue (/admin, /menu...) renvoie index.html,
  # jamais mis en cache pour qu'une mise a jour soit vue immediatement.
  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
