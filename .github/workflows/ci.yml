# Integration continue : a chaque push et chaque pull request.
#  1. tests de l'API contre un vrai PostgreSQL + compilation du front
#  2. construction des deux images Docker (verifie les Dockerfiles)
#  3. sur main uniquement : publication des images sur GitHub Container Registry,
#     ou Watchtower (docker-compose.prod.yml) viendra les chercher.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests et build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hasdrubal
          POSTGRES_PASSWORD: hasdrubal
          POSTGRES_DB: hasdrubal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hasdrubal"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hasdrubal:hasdrubal@localhost:5432/hasdrubal_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests de l'API
        run: npm test
      - name: Compilation du front
        run: npm run build

  docker:
    name: Images Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: server/Dockerfile
          - name: web
            dockerfile: client/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Nom de l'image (GHCR exige des minuscules)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hasdrubal-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Connexion a GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction (et publication sur main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
